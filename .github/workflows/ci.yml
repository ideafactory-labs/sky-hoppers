name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # `checks` is the required status check in the repository ruleset.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Workflow policy (pinned actions, no pull_request_target, explicit permissions)
        run: python3 .factory/check_workflows.py .github/workflows

      - name: actionlint
        # Retried: a GitHub release-download blip once served a 92-byte error page
        # instead of the tarball and failed the required check.
        run: |
          for attempt in 1 2 3; do
            if bash <(curl -sSfL --retry 3 https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            echo "actionlint download failed (attempt $attempt), retrying"; sleep $((attempt * 10))
          done
          ./actionlint -color

      - name: Install test dependencies (Playwright + Chromium)
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Project checks
        run: make test
        env:
          EVIDENCE_DIR: evidence

      # The exact site/ that Pages would publish. Download, unzip, open index.html to play.
      - name: Upload playable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-sky-hoppers
          path: site/
          retention-days: 14

      # Screenshots (title, gameplay, level complete, phone) and frame-time numbers.
      - name: Upload evidence
        if: always() && hashFiles('evidence/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence
          path: evidence/
          retention-days: 14

      # Tier 0 of the cost ladder: a throwaway Kubernetes cluster on the runner, for
      # projects that ship an e2e/kind.sh. Free on public repositories.
      - name: kind cluster
        if: hashFiles('e2e/kind.sh') != ''
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2

      - name: e2e on kind
        if: hashFiles('e2e/kind.sh') != ''
        run: bash e2e/kind.sh
